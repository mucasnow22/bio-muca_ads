  <style>
    :root {
      color-scheme: dark;
      --blue: #4f9dff;
      --blue-light: #a9d1ff;
      --blue-dark: #1d4fa3;
      --ice: #eaf3ff;
      --border: #4f9dff52;
      font-family: Montserrat, Arial, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html { background: #03060c; min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ice);
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(circle at 50% -10%, #0f2a55 0, #0a1a36c2 20%, #050a14 49%, #020408 100%);
      overflow-x: hidden;
    }
    /* grade sutil no topo */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: .1;
      background-image: linear-gradient(#ffffff06 1px, #0000 1px), linear-gradient(90deg, #ffffff05 1px, #0000 1px);
      background-size: 72px 72px;
      -webkit-mask-image: linear-gradient(#000, #0000 80%);
      mask-image: linear-gradient(#000, #0000 80%);
    }
    #particles { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .background-glow {
      position: fixed; z-index: 0; pointer-events: none;
      width: 520px; height: 520px; top: -360px; left: calc(50% - 260px);
      border-radius: 50%;
      border: 1px solid #4f9dff12;
      box-shadow: 0 0 0 70px #4f9dff08, 0 0 0 140px #4f9dff05;
    }
    .bio-page { position: relative; z-index: 1; width: min(100%, 620px); margin: 0 auto; padding: 38px 24px 30px; }

    /* ---------- perfil ---------- */
    .profile { text-align: center; margin-bottom: 34px; }
    .portrait-wrap { position: relative; isolation: isolate; width: 132px; height: 132px; margin: 0 auto 17px; padding: 5px; border-radius: 50%; }
    .portrait-ring {
      position: absolute; inset: 0; z-index: -1; border-radius: 50%;
      background: conic-gradient(from 20deg, transparent 0 9%, var(--blue-light) 18%, var(--blue-dark) 40%, transparent 49% 60%, var(--blue) 73%, #0d2a66 91%, transparent);
      filter: drop-shadow(0 0 14px #4f9dff66);
      animation: spin 7s linear infinite;
    }
    .portrait-wrap::before { content: ""; position: absolute; inset: 3px; z-index: 0; background: #050a14; border-radius: 50%; }
    .portrait {
      position: relative; z-index: 1; display: block;
      width: 122px; height: 122px; object-fit: cover; border-radius: 50%;
      border: 3px solid #050a14;
      filter: contrast(1.04);
      box-shadow: 0 10px 35px #0000008c;
    }
    .verified {
      position: absolute; z-index: 2; right: 0; bottom: 6px;
      display: grid; place-items: center; width: 34px; height: 34px; padding: 3px;
      background: #050a14; border: 3px solid #050a14; border-radius: 50%;
    }
    .verified svg { width: 100%; height: 100%; fill: #0095f6; }
    .verified .check { fill: none; stroke: #fff; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
    .profile h1 { margin: 0 0 11px; font-size: 1.33rem; font-weight: 700; line-height: 1.2; letter-spacing: 1.35px; text-transform: uppercase; text-shadow: 0 3px 18px #0009; }
    .bio { margin: 0; color: #b9c6db; font-size: .92rem; line-height: 1.66; }
    .bio strong { color: #d3e3fa; font-weight: 500; }
    .bio a { color: var(--blue-light); font-weight: 500; text-decoration: none; }
    .bio a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .profile-divider { display: flex; justify-content: center; align-items: center; gap: 9px; margin-top: 22px; }
    .profile-divider span { width: 45px; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
    .profile-divider span:last-child { transform: scaleX(-1); }
    .profile-divider i { width: 5px; height: 5px; background: var(--blue); transform: rotate(45deg); box-shadow: 0 0 11px #4f9dffb3; }

    /* ---------- cards ---------- */
    .links { display: flex; flex-direction: column; gap: 16px; }
    .link-card {
      --mx: 50%; --my: 50%;
      position: relative; overflow: hidden;
      display: flex; align-items: center; min-height: 80px; padding: 12px 19px;
      color: inherit; text-decoration: none;
      border: 1px solid var(--border); border-radius: 15px;
      background: radial-gradient(260px circle at var(--mx) var(--my), #4f9dff1f, transparent 45%), linear-gradient(135deg, #0f1726e6, #070b13c7);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px #00000045, inset 0 1px #ffffff06;
      transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;
    }
    .link-card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: linear-gradient(110deg, #0000 20%, #b4d7ff1f 47%, #0000 74%);
      transform: translate(-80%);
      transition: transform .6s, opacity .3s;
    }
    .link-card:hover { border-color: #7db8ffb8; transform: translateY(-3px) scale(1.012); box-shadow: 0 14px 35px #0000006b, 0 0 24px #4f9dff1a, inset 0 1px #ffffff0d; }
    .link-card:hover::before { opacity: 1; transform: translate(80%); }
    .card-icon { position: relative; z-index: 1; display: grid; place-items: center; flex: 0 0 55px; width: 55px; height: 55px; margin-right: 17px; border-radius: 12px; }
    .card-icon svg { width: 32px; height: 32px; }
    .youtube-icon { background: linear-gradient(145deg, #ff000024, #ff000009); border: 1px solid #ff000052; }
    .youtube-icon svg { width: 34px; height: 34px; fill: red; }
    .youtube-icon .play { fill: #fff; }
    .tiktok-icon { background: linear-gradient(145deg, #25f4ee1c, #fe2c550f); border: 1px solid #ffffff2e; }
    .whatsapp-icon { background: linear-gradient(145deg, #25d36626, #25d3660a); border: 1px solid #25d36652; }
    .whatsapp-icon svg { fill: #25d366; }
    .card-copy { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; gap: 5px; min-width: 0; }
    .card-copy strong { font-size: 1.03rem; font-weight: 600; line-height: 1.15; letter-spacing: .25px; }
    .card-copy small { color: #9eabbf; font-size: .78rem; font-weight: 400; line-height: 1.3; }
    .card-arrow {
      position: relative; z-index: 1; display: grid; place-items: center;
      width: 36px; height: 36px; margin-left: 13px;
      color: var(--blue); border: 1px solid #4f9dff2e; border-radius: 50%;
      transition: background .25s, transform .25s, color .25s;
    }
    .card-arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round; }
    .link-card:hover .card-arrow { color: #04101f; background: var(--blue-light); transform: translate(3px); }

    /* ---------- rodapé ---------- */
    footer {
      display: flex; justify-content: center; align-items: center; gap: 9px;
      margin-top: 40px; padding-top: 21px;
      color: #6f7a8c; font-size: .7rem; text-align: center;
      border-top: 1px solid #4f9dff1a;
    }
    footer p { margin: 0; }
    .footer-line { width: 1px; height: 12px; background: #4f9dff38; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .bio-page { padding: 30px 18px 24px; }
      .profile { margin-bottom: 29px; }
      .portrait-wrap { width: 120px; height: 120px; }
      .portrait { width: 110px; height: 110px; }
      .verified { width: 32px; height: 32px; }
      .profile h1 { font-size: 1.15rem; }
      .bio { font-size: .77rem; line-height: 1.68; }
      .links { gap: 13px; }
      .link-card { min-height: 76px; padding: 11px 14px; border-radius: 13px; }
      .card-icon { flex-basis: 51px; width: 51px; height: 51px; margin-right: 13px; }
      .card-copy strong { font-size: .88rem; }
      .card-copy small { font-size: .68rem; }
      .card-arrow { width: 32px; height: 32px; margin-left: 8px; }
      footer { flex-wrap: wrap; row-gap: 5px; margin-top: 32px; font-size: .62rem; }
    }
    @media (max-width: 380px) {
      .bio-page { padding-inline: 14px; }
      .card-copy strong { font-size: .8rem; }
      .card-copy small { font-size: .62rem; }
      .card-icon { flex-basis: 46px; width: 46px; height: 46px; margin-right: 11px; }
      .link-card { padding-inline: 12px; }
      .card-arrow { width: 29px; height: 29px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .portrait-ring { animation: none; }
      .link-card, .card-arrow, .link-card::before { transition: none; }
    }
  </style>
</head>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // brilho que acompanha o mouse nos cards
    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('pointermove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });

    // partículas de neve
    (() => {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, dpr, flakes = [];

      function makeFlake(randomY) {
        const r = Math.random() * 2.2 + 0.6;
        return {
          x: Math.random() * w,
          y: randomY ? Math.random() * h : -10,
          r,
          vy: r * 0.25 + Math.random() * 0.35,          // flocos maiores caem mais rápido
          vx: (Math.random() - 0.5) * 0.25,
          a: Math.random() * 0.25 + 0.08,                // quase transparentes
          sway: Math.random() * Math.PI * 2,
          swaySpeed: Math.random() * 0.01 + 0.004
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(140, (w * h) / 9000));
        flakes = Array.from({ length: count }, () => makeFlake(true));
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const f of flakes) {
          f.sway += f.swaySpeed;
          f.x += f.vx + Math.sin(f.sway) * 0.3;
          f.y += f.vy;
          if (f.y > h + 10 || f.x < -10 || f.x > w + 10) Object.assign(f, makeFlake(false));
          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${f.a})`;
          ctx.shadowColor = 'rgba(255,255,255,0.5)';
          ctx.shadowBlur = f.r * 2;
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>
